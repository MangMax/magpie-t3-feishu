<!doctype html><html lang="zh"><meta charset="utf-8"><title>T3 飞书桥</title><style>body{font:16px system-ui;max-width:700px;margin:60px auto;padding:24px;background:#f7f8fb;color:#17223b}button{padding:12px 20px;border:0;border-radius:8px;background:#3868de;color:white;cursor:pointer}p{line-height:1.8}</style><h1>T3 飞书桥</h1><p>复用已连接 Magpie 的 T3 MCP，以飞书机器人私聊收发文字。无需公网入口。首次先创建本机控制密钥，随后重新打开此页进入设置。</p><button id="open">准备中…</button><p id="status"></p><script>
(async()=>{await magpie.ready;const opts=await magpie.options.get();const button=document.querySelector('#open'),status=document.querySelector('#status');button.textContent=opts.controlToken?'打开设置':'创建本地控制密钥';button.onclick=async()=>{button.disabled=true;try{if(!opts.controlToken){const bytes=crypto.getRandomValues(new Uint8Array(32));await magpie.options.set({...opts,controlToken:Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('')});status.textContent='已保存。插件宿主正在重启，请关闭并重新打开本页。';return;}const target=new URL(magpie.service||`http://127.0.0.1:${opts.port||18991}/`,location.href);target.hash=opts.controlToken;location.replace(target.href);}catch{status.textContent='无法打开，请检查插件是否启用，然后重新打开页面。';button.disabled=false;}};})();
</script></html>
