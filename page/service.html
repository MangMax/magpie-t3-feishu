<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>T3 飞书桥</title><style>body{font:15px system-ui;max-width:760px;margin:32px auto;padding:20px;color:#18243a;background:#f6f8fc}section{background:white;padding:24px;border:1px solid #dce3ef;border-radius:16px;margin:16px 0}label{display:block;margin:16px 0}input:not([type=checkbox]),textarea{display:block;width:100%;box-sizing:border-box;padding:10px;margin-top:6px;border:1px solid #bbc8dc;border-radius:6px;font:inherit}button{background:#3568d4;color:white;border:0;border-radius:8px;padding:12px 20px;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#58677c}h1{margin-bottom:6px}</style><h1>T3 飞书桥</h1><small>仅白名单私聊 · Magpie MCP 代理 · 不代批执行权限</small><section><h2>连接配置</h2><form id="form"><label><input type="checkbox" id="enabled"> 启用桥接</label><label>飞书应用 App ID<input id="appId" autocomplete="off"></label><label>App Secret（留空保留已有）<input id="appSecret" type="password" autocomplete="new-password"></label><label>Magpie 中 T3 MCP 的服务器名称<input id="serverName" placeholder="t3code"></label><label>允许用户及绑定线程，每行：open_id,thread_id,environment_id（第三项可省略）<textarea id="bindings" rows="4" placeholder="ou_xxx,thread-id"></textarea></label><p><small>每位用户使用独立线程。机器人只接收私聊文字；不会开启新线程，也不会响应群聊。启用后白名单用户发送的普通文字会提交给 T3 执行，请只添加可信本人账号。</small></p><button>保存并应用</button></form><p id="notice"></p></section><section><h2>状态</h2><button id="refresh">刷新</button><pre id="status">加载中…</pre><small>发送回执不明确时停止自动重发。请回 T3 查看回复、处理权限审批。重新打开插件页可重新进入此控制台。</small></section><script>
const token=location.hash.slice(1);try{history.replaceState(null,'',location.pathname+location.search);}catch{}const $=id=>document.getElementById(id);async function api(path,body){const r=await fetch(new URL(path,location.href),{method:body?'POST':'GET',headers:{authorization:'Bearer '+token,...(body?{'content-type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});if(!r.ok)throw new Error('请求失败（'+r.status+'），请从 Magpie 插件页重新打开并检查配置。');return r.json();}async function refresh(){$('status').textContent=JSON.stringify(await api('api/status'),null,2);}async function load(){const c=await api('api/config');$('enabled').checked=c.enabled;$('appId').value=c.appId;$('serverName').value=c.serverName;$('appSecret').placeholder=c.hasSecret?'已保存，留空不变':'必填';$('bindings').value=c.bindings.map(b=>[b.userId,b.threadId,b.environmentId].filter(Boolean).join(',')).join('\n');await refresh();} $('form').onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;try{await api('api/config',{enabled:$('enabled').checked,appId:$('appId').value,appSecret:$('appSecret').value,serverName:$('serverName').value,bindings:$('bindings').value.split('\n').filter(s=>s.trim()).map(s=>{const [userId,threadId,environmentId]=s.split(',').map(s=>s.trim());return {userId,threadId,environmentId};})});$('appSecret').value='';$('notice').textContent='配置已保存。';await refresh();}catch(e){$('notice').textContent=e.message;}finally{b.disabled=false;}};$('refresh').onclick=()=>refresh().catch(e=>$('notice').textContent=e.message);load().catch(e=>$('notice').textContent=e.message);
</script></html>
